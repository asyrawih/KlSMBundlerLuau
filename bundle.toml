# Sync folder = game. Paths below are relative to this file.
root = "../RessoMusic"
minify = "full"
external = ["ReplicatedStorage"]
# AddonLoader scans Addon/*/Features at runtime; a copy goes in each bundle so it can
# require the bundled addons through the `script` stand-in.
internal = ["ReplicatedStorage.AddonLoader"]
# One folder per feature in each of these; client profiles (clients/<name>.toml) switch
# features off by folder name. `*` = the side (Server / Client / Shared).
features = "Addon/*/Features"

# Studio-only content copied from the place's last saved version into client packages.
# Needs an Open Cloud API key: ROBLOX_API_KEY, or a .roblox-api-key file next to this one.
[place]
id = 82391043752226
assets = ["ReplicatedStorage.EffectDonation", "ReplicatedStorage.Asset"]

[[bundle]]
entry  = "ServerScriptService/Server/Main.server.luau"
output = "/Users/dxh4nan/Documents/RessoMusic/ServerScriptService/Loader.server.luau"
rbxmx  = "dist/Server.rbxmx"
include = [
  "Addon/Server/Features/*/*Service.luau",
  "Addon/Server/Features/*/*Boot.luau",   # loaded by Main before the base services
]
exclude = [
  "Addon/Server/Features/MimicParty/*Service.luau",
  "Addon/Server/Features/Affiliate/*Service.luau",
]

[[bundle]]
entry  = "StarterPlayerScripts/Client/Main.client.luau"
output = "/Users/dxh4nan/Documents/RessoMusic/StarterPlayerScripts/Loader.client.luau"
rbxmx  = "dist/Client.rbxmx"
include = [
  "Addon/Client/Features/*/*Controller.luau",
  "Addon/Client/Features/*/*Boot.luau",
]
exclude = [
  "Addon/Client/Features/MimicParty/*Controller.luau",
  "Addon/Client/Features/Affiliate/*Controller.luau",
]
