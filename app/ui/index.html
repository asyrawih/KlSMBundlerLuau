<html lang="en">
<head>

<header class="topbar" data-tauri-drag-region>
  <span class="logo" data-tauri-drag-region><svg class="logogram" aria-hidden="true"><use href="#logogram"/></svg><span class="logo__text">UNREST STUDIO</span></span>
  <span class="topbar__app" data-tauri-drag-region>Bundler</span>
  <form class="project" id="projectForm">
    <input class="input input--sm" id="configPath" placeholder="/path/to/bundle.toml" spellcheck="false" autocomplete="off" aria-label="bundle.toml path">
    <button class="btn btn--secondary btn--sm" type="submit">Open</button>
  </form>
</header>

<div class="shell">
  <aside class="sidebar">
    <h6>Clients</h6>
    <nav class="clients" id="clients"></nav>
    <form class="new-client" id="newClient">
      <input class="input input--sm" id="newName" placeholder="new-client" pattern="[A-Za-z0-9_\-]+" title="Letters, digits, - and _" autocomplete="off" aria-label="New client name">
      <button class="icon-btn icon-btn--sm" type="submit" aria-label="Add client"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
    <form class="place" id="placeForm" hidden>
      <h6>Roblox place</h6>
      <p class="muted" id="placeStatus"></p>
      <input class="input input--sm" id="placeId" inputmode="numeric" pattern="[0-9]+" title="Digits only" placeholder="Place ID" autocomplete="off" aria-label="Roblox place ID">
      <input class="input input--sm" id="apiKey" type="password" placeholder="Open Cloud API key" autocomplete="off" spellcheck="false" aria-label="Roblox Open Cloud API key">
      <button class="btn btn--secondary btn--sm" type="submit">Save</button>
    </form>
    <div class="assets" id="assetsBox" hidden>
      <h6>Place assets</h6>
      <ul class="assets__list" id="assetList"></ul>
      <form class="new-client" id="newAsset">
        <input class="input input--sm" id="newAssetPath" placeholder="Workspace.Map" autocomplete="off" spellcheck="false" pattern="[^.]+\..+" title="Service.Path, e.g. ServerStorage.Models" aria-label="Instance path to ship">
        <button class="icon-btn icon-btn--sm" type="submit" aria-label="Add asset path"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </form>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="empty" id="emptyState">
      <div class="empty__icon card--underglow"><svg class="logogram" aria-hidden="true"><use href="#logogram"/></svg></div>
      <h3 id="emptyTitle">Open a bundle.toml</h3>
      <p class="muted" id="emptyBody">Paste its path above. It needs <code>features = "Addon/*/Features"</code>.</p>
    </div>

    <section class="client" id="clientView" hidden>
      <div class="client__head">
        <div>
          <h6>Client</h6>
          <h2 id="clientName"></h2>
          <p class="muted" id="clientSummary"></p>
        </div>
        <div class="client__actions">
          <button class="btn btn--ghost btn--sm" id="allOn" type="button">Enable all</button>
          <button class="btn btn--primary btn--glow" id="buildBtn" type="button">Build bundle</button>
        </div>
      </div>
      <div class="features" id="features"></div>
    </section>

    <section class="log" id="logPanel" hidden>
      <div class="log__head">
        <span class="status" id="logStatus"></span>
        <button class="btn btn--text" id="reveal" type="button" hidden>Show in Finder ↗</button>
      </div>
      <div id="leftovers"></div>
      <pre class="log__body" id="logBody"></pre>
    </section>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
